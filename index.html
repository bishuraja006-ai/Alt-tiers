<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alt Tiers</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#080a0e;
color:white;
}

header{
background:#11151b;
border-bottom:1px solid #292f39;
padding:15px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:2px;
}

.logo span{color:#7c5cff}

.nav{
display:flex;
gap:6px;
}

.nav button{
background:#1a2028;
color:white;
border:1px solid #303844;
padding:9px 12px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}

.nav button.active{
background:#7c5cff;
border-color:#7c5cff;
}

.hero{
text-align:center;
padding:45px 15px 25px;
}

.hero h1{font-size:40px}
.hero h1 span{color:#7c5cff}

.hero p{
color:#929aa6;
margin-top:10px;
}

.section{
display:none;
max-width:950px;
margin:auto;
padding:15px 15px 60px;
}

.section.active{display:block}
