<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers Style</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .modes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #374151;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4b5563;
        }

        .tier {
            width: 90%;
            max-width: 700px;
            margin: 15px auto;
            padding: 20px;
            background: #1f2937;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🏆 Minecraft PvP Tier List</h1>

    <div class="modes">
        <button>NethPot</button>
        <button>Crystal UHC</button>
        <button>Sword</button>
        <button>Axe</button>
        <button>SMP</button>
        <button>Mace</button>
    </div>

    <div class="tier">
        <h2>HT1</h2>
        <p>No players yet</p>
    </div>

    <div class="tier">
        <h2>LT1</h2>
        <p>No players yet</p>
    </div>

    <div class="tier">
        <h2>HT2</h2>
        <p>No players yet</p>
    </div>

    <div class="tier">
        <h2>LT2</h2>
        <p>No players yet</p>
    </div>

</body>
</html>
