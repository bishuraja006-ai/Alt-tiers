<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alt Tiers</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#080a0e;
color:white;
}

header{
background:#11151b;
border-bottom:1px solid #292f39;
padding:15px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:2px;
}

.logo span{
color:#7c5cff;
}

.nav{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.nav button{
background:#1a2028;
color:white;
border:1px solid #303844;
padding:9px 12px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}

.nav button.active{
background:#7c5cff;
border-color:#7c5cff;
}

.hero{
text-align:center;
padding:45px 15px 25px;
}

.hero h1{
font-size:40px;
}

.hero h1 span{
color:#7c5cff;
}

.hero p{
color:#929aa6;
margin-top:10px;
}

.section{
display:none;
max-width:950px;
margin:auto;
padding:15px 15px 60px;
}

.section.active{
display:block;
}

.mode-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px;
}

.mode-buttons button{
background:#151a21;
border:1px solid #303844;
color:white;
padding:10px 14px;
border-radius:7px;
cursor:pointer;
font-weight:bold;
}

.mode-buttons button.active{
background:#7c5cff;
border-color:#7c5cff;
}

.search{
width:100%;
padding:13px;
background:#11151b;
border:1px solid #303844;
border-radius:8px;
color:white;
outline:none;
margin-bottom:15px;
font-size:15px;
}

.tier{
display:flex;
margin-bottom:8px;
border:1px solid #292f39;
border-radius:8px;
overflow:hidden;
background:#11151b;
min-height:58px;
}

.tier-name{
width:75px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:18px;
background:#1a2028;
flex-shrink:0;
}

.tier-players{
display:flex;
align-items:center;
gap:7px;
padding:8px;
flex-wrap:wrap;
}

.player{
background:#1b222c;
border:1px solid #303844;
padding:8px 11px;
border-radius:6px;
font-weight:bold;
}

.overall-card{
display:flex;
align-items:center;
gap:15px;
background:#11151b;
border:1px solid #292f39;
border-radius:9px;
padding:14px;
margin-bottom:9px;
}

.rank{
font-size:21px;
font-weight:900;
width:35px;
text-align:center;
color:#7c5cff;
}

.overall-info{
flex:1;
}

.ign{
font-size:17px;
font-weight:900;
}

.points{
color:#929aa6;
font-size:13px;
margin-top:4px;
}

.badges{
display:flex;
gap:5px;
flex-wrap:wrap;
}

.badge{
background:#1b222c;
border:1px solid #303844;
border-radius:5px;
padding:5px 7px;
font-size:12px;
font-weight:bold;
}

.player-card{
background:#11151b;
border:1px solid #292f39;
border-radius:9px;
padding:15px;
margin-bottom:10px;
}

.player-card h3{
margin-bottom:10px;
}

.player-tier{
display:inline-block;
background:#1b222c;
border:1px solid #303844;
padding:6px 8px;
border-radius:5px;
margin:3px;
font-size:12px;
font-weight:bold;
}

.admin-box{
background:#11151b;
border:1px solid #292f39;
border-radius:9px;
padding:20px;
}

.admin-box input,
.admin-box select{
width:100%;
padding:11px;
margin-bottom:10px;
background:#080a0e;
border:1px solid #303844;
border-radius:7px;
color:white;
outline:none;
}

.admin-box button{
background:#7c5cff;
border:0;
color:white;
padding:11px 16px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}

.admin-player{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px 0;
border-bottom:1px solid #292f39;
}

.admin-actions button{
padding:6px 9px;
border:1px solid #303844;
background:#1a2028;
color:white;
border-radius:5px;
cursor:pointer;
}

.empty{
text-align:center;
color:#929aa6;
padding:30px;
}

.status{
text-align:center;
color:#929aa6;
padding:15px;
font-size:13px;
}

.error{
background:#291419;
border:1px solid #70333d;
color:#ff9ca8;
padding:12px;
border-radius:7px;
margin-bottom:15px;
display:none;
}

.success{
background:#14291c;
border:1px solid #326b42;
color:#9cffb2;
padding:12px;
border-radius:7px;
margin-bottom:15px;
display:none;
}

@media(max-width:600px){

.header{
align-items:flex-start;
flex-direction:column;
}

.nav{
width:100%;
}

.nav button{
flex:1;
}

.hero h1{
font-size:32px;
}

.tier-name{
width:62px;
font-size:15px;
}

.overall-card{
align-items:flex-start;
}

.badges{
max-width:150px;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
ALT <span>TIERS</span>
</div>

<div class="nav">

<button
class="navbtn active"
onclick="showSection('tiers',this)">
Tier List
</button>

<button
class="navbtn"
onclick="showSection('overall',this)">
Overall
</button>

<button
class="navbtn"
onclick="showSection('players',this)">
Players
</button>

<button
class="navbtn"
onclick="showSection('admin',this)">
Admin
</button>

</div>

</div>

</header>


<div class="hero">

<h1>
ALT <span>TIERS</span>
</h1>

<p>
Minecraft PvP Tier List
</p>

</div>


<!-- TIER LIST -->

<section
id="tiers"
class="section active">

<div class="mode-buttons">

<button
class="mode active"
onclick="changeMode('NethPot',this)">
NethPot
</button>

<button
class="mode"
onclick="changeMode('Crystal',this)">
Crystal
</button>

<button
class="mode"
onclick="changeMode('UHC',this)">
UHC
</button>

<button
class="mode"
onclick="changeMode('Sword',this)">
Sword
</button>

<button
class="mode"
onclick="changeMode('Axe',this)">
Axe
</button>

<button
class="mode"
onclick="changeMode('SMP',this)">
SMP
</button>

<button
class="mode"
onclick="changeMode('Mace',this)">
Mace
</button>

<button
class="mode"
onclick="changeMode('Spear Mace',this)">
Spear Mace
</button>

<button
class="mode"
onclick="changeMode('Cart',this)">
Cart
</button>

</div>

<input
class="search"
id="tierSearch"
placeholder="Search player..."
oninput="renderTierList()"
>

<div
id="firebaseError"
class="error">
</div>

<div
id="firebaseSuccess"
class="success">
</div>

<div id="tierList">

<div class="status">
Loading tiers...
</div>

</div>

</section>


<!-- OVERALL -->

<section
id="overall"
class="section">

<input
class="search"
id="overallSearch"
placeholder="Search player..."
oninput="renderOverall()"
>

<div id="overallList">

<div class="status">
Loading...
</div>

</div>

</section>


<!-- PLAYERS -->

<section
id="players"
class="section">

<input
class="search"
id="playerSearch"
placeholder="Search player..."
oninput="renderPlayers()"
>

<div id="playerlist">

<div class="status">
Loading...
</div>

</div>

</section>


<!-- ADMIN -->

<section
id="admin"
class="section">

<div class="admin-box">

<h2 style="margin-bottom:15px;">
Admin Panel
</h2>

<input
id="adminPassword"
type="password"
placeholder="Admin password"
>

<button
onclick="loginAdmin()">
Login
</button>

<div
id="adminPanel"
style="display:none;margin-top:20px;"
>

<input
id="playerName"
placeholder="Player IGN"
>

<select id="playerMode">

<option>NethPot</option>
<option>Crystal</option>
<option>UHC</option>
<option>Sword</option>
<option>Axe</option>
<option>SMP</option>
<option>Mace</option>
<option>Spear Mace</option>
<option>Cart</option>

</select>

<select id="playerTier">

<option>HT5</option>
<option>LT5</option>
<option>HT4</option>
<option>LT4</option>
<option>HT3</option>
<option>LT3</option>
<option>HT2</option>
<option>LT2</option>
<option>HT1</option>
<option>LT1</option>

</select>

<button
onclick="addPlayer()">
Add / Update Player
</button>

<div
id="adminPlayers"
style="margin-top:20px;">
</div>

</div>

</div>

</section>


<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
doc,
setDoc,
deleteDoc,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyBoifgMvEE12eF6mi8s5Sce6RmNXAG0Alk",

authDomain:
"alt-tier.firebaseapp.com",

projectId:
"alt-tier",

storageBucket:
"alt-tier.firebasestorage.app",

messagingSenderId:
"752454762187",

appId:
"1:752454762187:web:f8d7a15c1b5aee705f254e"

};


/* INITIALIZE */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const playersRef =
collection(db,"players");


/* DATA */

let players = {};

let currentMode = "NethPot";


/* POINTS */

const points = {

LT5:1,
HT5:2,

LT4:4,
HT4:6,

LT3:8,
HT3:10,

LT2:15,
HT2:20,

LT1:40,
HT1:60

};


/* TIER ORDER */

const tierOrder = [

"HT1",
"LT1",

"HT2",
"LT2",

"HT3",
"LT3",

"HT4",
"LT4",

"HT5",
"LT5"

];


/* ERROR */

function showFirebaseError(error){

console.error(error);

const box =
document.getElementById("firebaseError");

if(!box) return;

box.style.display = "block";

box.innerText =
"Firebase error: " +
(error?.message || error);

}


/* SUCCESS */

function showSuccess(message){

const box =
document.getElementById("firebaseSuccess");

if(!box) return;

box.style.display = "block";

box.innerText = message;

setTimeout(()=>{
box.style.display="none";
},2500);

}


/* NAVIGATION */

function showSection(id,button){

document
.querySelectorAll(".section")
.forEach(x =>
x.classList.remove("active")
);

const section =
document.getElementById(id);

if(section){

section.classList.add("active");

}

document
.querySelectorAll(".navbtn")
.forEach(x =>
x.classList.remove("active")
);

if(button){

button.classList.add("active");

}

if(id === "tiers")
renderTierList();

if(id === "overall")
renderOverall();

if(id === "players")
renderPlayers();

if(id === "admin")
renderAdmin();

}


/* CHANGE MODE */

function changeMode(mode,button){

currentMode = mode;

document
.querySelectorAll(".mode")
.forEach(x =>
x.classList.remove("active")
);

if(button){

button.classList.add("active");

}

renderTierList();

}


/* TIER LIST */

function renderTierList(){

const box =
document.getElementById("tierList");

if(!box) return;

const searchInput =
document.getElementById("tierSearch");

const search =
(searchInput?.value || "")
.toLowerCase();

box.innerHTML = "";


tierOrder.forEach(tier => {

let names = [];

Object.keys(players).forEach(name => {

const data =
players[name];

if(
data &&
data[currentMode] === tier &&
name.toLowerCase().includes(search)
){

names.push(name);

}

});


const row =
document.createElement("div");

row.className = "tier";


let playerHTML = "";


names.forEach(name => {

playerHTML +=
`<div class="player">${escapeHTML(name)}</div>`;

});


if(names.length === 0){

playerHTML +=
`<span style="color:#59616d">
No players
</span>`;

}


row.innerHTML = `

<div class="tier-name">
${tier}
</div>

<div class="tier-players">
${playerHTML}
</div>

`;

box.appendChild(row);

});

}


/* OVERALL */

function getOverall(){

let list = [];


Object.keys(players).forEach(name => {

let total = 0;

let badges = [];

const player =
players[name];


Object.keys(player || {})
.forEach(mode => {

const tier =
player[mode];

if(points[tier]){

total += points[tier];

badges.push({

mode:mode,
tier:tier

});

}

});


if(total > 0){

list.push({

name:name,
points:total,
badges:badges

});

}

});


list.sort(
(a,b) =>
b.points - a.points
);

return list;

}


/* RENDER OVERALL */

function renderOverall(){

const box =
document.getElementById("overallList");

if(!box) return;

const search =
(
document.getElementById("overallSearch")
?.value || ""
)
.toLowerCase();

box.innerHTML = "";


const list =
getOverall()
.filter(x =>
x.name.toLowerCase().includes(search)
);


if(list.length === 0){

box.innerHTML =
`<div class="empty">
No players found.
</div>`;

return;

}


list.forEach((p,index) => {

const card =
document.createElement("div");

card.className =
"overall-card";


let badgesHTML = "";


p.badges.forEach(b => {

badgesHTML += `

<div class="badge">

${escapeHTML(b.mode)}:
${escapeHTML(b.tier)}

</div>

`;

});


card.innerHTML = `

<div class="rank">
#${index + 1}
</div>

<div class="overall-info">

<div class="ign">
${escapeHTML(p.name)}
</div>

<div class="points">
${p.points} points
</div>

</div>

<div class="badges">
${badgesHTML}
</div>

`;

box.appendChild(card);

});

}


/* PLAYERS */

function renderPlayers(){

const box =
document.getElementById("playerlist");

if(!box) return;

const search =
(
document.getElementById("playerSearch")
?.value || ""
)
.toLowerCase();

box.innerHTML = "";


const names =
Object.keys(players)
.filter(name =>
name.toLowerCase().includes(search)
);


if(names.length === 0){

box.innerHTML =
`<div class="empty">
No players found.
</div>`;

return;

}


names.forEach(name => {

const card =
document.createElement("div");

card.className =
"player-card";


let html =
`<h3>${escapeHTML(name)}</h3>`;


Object.keys(players[name] || {})
.forEach(mode => {

html += `

<span class="player-tier">

${escapeHTML(mode)}:
${escapeHTML(players[name][mode])}

</span>

`;

});


card.innerHTML = html;

box.appendChild(card);

});

}


/* ADMIN LOGIN */

function loginAdmin(){

const pass =
document.getElementById("adminPassword").value;


if(pass === "Tiers"){

document.getElementById(
"adminPanel"
).style.display = "block";

renderAdmin();

}
else{

alert("Wrong password");

}

}


/* ADD / UPDATE PLAYER */

async function addPlayer(){

const name =
document.getElementById("playerName")
.value
.trim();


const mode =
document.getElementById("playerMode")
.value;


const tier =
document.getElementById("playerTier")
.value;


if(!name){

alert("Enter player IGN");

return;

}


try{

let data =
players[name] || {};


data[mode] =
tier;


await setDoc(

doc(
db,
"players",
name
),

data

);


document.getElementById(
"playerName"
).value = "";


showSuccess(
"Player tier saved successfully!"
);

}
catch(error){

showFirebaseError(error);

}

}


/* DELETE PLAYER */

async function deletePlayer(name){

if(
!confirm(
"Delete " + name + "?"
)
){

return;

}


try{

await deleteDoc(

doc(
db,
"players",
name
)

);

showSuccess(
"Player deleted!"
);

}
catch(error){

showFirebaseError(error);

}

}


/* ADMIN LIST */

function renderAdmin(){

const box =
document.getElementById(
"adminPlayers"
);

if(!box) return;

box.innerHTML = "";


const names =
Object.keys(players);


if(names.length === 0){

box.innerHTML =
`<div class="empty">
No players in database.
</div>`;

return;

}


names.forEach(name => {

const row =
document.createElement("div");

row.className =
"admin-player";


row.innerHTML = `

<div>
<strong>
${escapeHTML(name)}
</strong>
</div>

<div class="admin-actions">

<button
class="delete-btn">
DELETE
</button>

</div>

`;


row
.querySelector(".delete-btn")
.addEventListener(
"click",
() => deletePlayer(name)
);


box.appendChild(row);

});

}


/* HTML ESCAPE */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* FIRESTORE REAL-TIME LISTENER */

onSnapshot(

playersRef,

snapshot => {

players = {};

snapshot.forEach(item => {

players[item.id] =
item.data();

});


renderTierList();
renderOverall();
renderPlayers();
renderAdmin();

},

error => {

showFirebaseError(error);

}

);


/* MAKE MODULE FUNCTIONS AVAILABLE TO HTML */

window.showSection =
showSection;

window.changeMode =
changeMode;

window.renderTierList =
renderTierList;

window.renderOverall =
renderOverall;

window.renderPlayers =
renderPlayers;

window.loginAdmin =
loginAdmin;

window.addPlayer =
addPlayer;

window.deletePlayer =
deletePlayer;

</script>

</body>
     </html>
