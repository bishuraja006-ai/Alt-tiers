<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  deleteDoc,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "PASTE_YOUR_EXISTING_API_KEY_HERE",
  authDomain: "alt-tier.firebaseapp.com",
  projectId: "alt-tier",
  storageBucket: "alt-tier.firebasestorage.app",
  messagingSenderId: "752454762187",
  appId: "1:752454762187:web:f8d7a15c1b5aee705f254e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const playersRef = collection(db, "players");


/* =========================
   DATA
========================= */

let players = {};


/* =========================
   POINT SYSTEM
========================= */

const points = {
  "LT5":1,
  "HT5":2,
  "LT4":4,
  "HT4":6,
  "LT3":8,
  "HT3":10,
  "LT2":15,
  "HT2":20,
  "LT1":40,
  "HT1":60
};


/* =========================
   NAVIGATION
========================= */

function showSection(id,button){

  document.querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".navbtn")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  if(id==="tiers") renderTierList();
  if(id==="overall") renderOverall();
  if(id==="players") renderPlayers();
  if(id==="admin") renderAdmin();
}


/* =========================
   TIER MODES
========================= */

let currentMode="NethPot";

function changeMode(mode,button){

  currentMode=mode;

  document.querySelectorAll(".mode")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  renderTierList();
}


/* =========================
   TIER ORDER
========================= */

const tierOrder=[
  "HT1",
  "LT1",
  "HT2",
  "LT2",
  "HT3",
  "LT3",
  "HT4",
  "LT4",
  "HT5",
  "LT5"
];


/* =========================
   FIRESTORE REAL-TIME LOAD
========================= */

onSnapshot(playersRef, snapshot => {

  players = {};

  snapshot.forEach(item => {

    const data = item.data();

    players[item.id] = data;

  });

  renderTierList();
  renderOverall();
  renderPlayers();
  renderAdmin();

});


/* =========================
   TIER LIST
========================= */

function renderTierList(){

  let box=document.getElementById("tierList");

  if(!box)return;

  let search=(document.getElementById("tierSearch")?.value || "")
    .toLowerCase();

  box.innerHTML="";

  tierOrder.forEach(tier=>{

    let names=[];

    Object.keys(players).forEach(name=>{

      let data=players[name];

      if(
        data[currentMode]===tier &&
        name.toLowerCase().includes(search)
      ){
        names.push(name);
      }

    });

    let row=document.createElement("div");

    row.className="tier";

    row.innerHTML=`
      <div class="tier-name">${tier}</div>

      <div class="tier-players">

        ${names.map(n=>
          `<div class="player">${n}</div>`
        ).join("")}

        ${
          names.length===0
          ? '<span style="color:#59616d">No players</span>'
          : ''
        }

      </div>
    `;

    box.appendChild(row);

  });

}


/* =========================
   OVERALL
========================= */

function getOverall(){

  let list=[];

  Object.keys(players).forEach(name=>{

    let total=0;
    let badges=[];

    Object.keys(players[name] || {}).forEach(mode=>{

      let tier=players[name][mode];

      if(points[tier]){

        total+=points[tier];

        badges.push({
          mode:mode,
          tier:tier
        });

      }

    });

    if(total>0){

      list.push({
        name:name,
        points:total,
        badges:badges
      });

    }

  });

  list.sort((a,b)=>b.points-a.points);

  return list;

}


function renderOverall(){

  let box=document.getElementById("overallList");

  if(!box)return;

  let search=(document.getElementById("overallSearch")?.value || "")
    .toLowerCase();

  box.innerHTML="";

  let list=getOverall()
    .filter(x=>x.name.toLowerCase().includes(search));

  if(list.length===0){

    box.innerHTML=
      '<div class="empty">No players found.</div>';

    return;

  }

  list.forEach((p,index)=>{

    let card=document.createElement("div");

    card.className="overall-card";

    card.innerHTML=`

      <div class="rank">
        #${index+1}
      </div>

      <div class="overall-info">

        <div class="ign">
          ${p.name}
        </div>

        <div class="points">
          ${p.points} points
        </div>

      </div>

      <div class="badges">

        ${p.badges.map(b=>
          `<div class="badge">
            ${b.mode}: ${b.tier}
          </div>`
        ).join("")}

      </div>

    `;

    box.appendChild(card);

  });

}


/* =========================
   PLAYERS
========================= */

function renderPlayers(){

  let box=document.getElementById("playerlist");

  if(!box)return;

  let search=(document.getElementById("playerSearch")?.value || "")
    .toLowerCase();

  box.innerHTML="";

  let names=Object.keys(players)
    .filter(n=>n.toLowerCase().includes(search));

  if(names.length===0){

    box.innerHTML=
      '<div class="empty">No players found.</div>';

    return;

  }

  names.forEach(name=>{

    let card=document.createElement("div");

    card.className="player-card";

    let html=`<h3>${name}</h3>`;

    Object.keys(players[name]).forEach(mode=>{

      html+=`
        <span class="player-tier">
          ${mode}: ${players[name][mode]}
        </span>
      `;

    });

    card.innerHTML=html;

    box.appendChild(card);

  });

}


/* =========================
   ADMIN LOGIN
========================= */

function loginAdmin(){

  let pass=
    document.getElementById("adminPassword").value;

  if(pass==="Tiers"){

    document.getElementById("adminPanel")
      .style.display="block";

    renderAdmin();

  }else{

    alert("Wrong password");

  }

}


/* =========================
   ADD / UPDATE PLAYER
========================= */

async function addPlayer(){

  let name=
    document.getElementById("playerName")
      .value.trim();

  let mode=
    document.getElementById("playerMode")
      .value;

  let tier=
    document.getElementById("playerTier")
      .value;

  if(!name){

    alert("Enter player IGN");

    return;

  }

  try{

    if(!players[name]){
      players[name]={};
    }

    players[name][mode]=tier;

    await setDoc(
      doc(db,"players",name),
      players[name]
    );

    document.getElementById("playerName")
      .value="";

    renderAdmin();

  }catch(error){

    console.error(error);

    alert(
      "Firebase error: " +
      error.message
    );

  }

}


/* =========================
   DELETE PLAYER
========================= */

async function deletePlayer(name){

  if(!confirm("Delete "+name+"?"))
    return;

  try{

    await deleteDoc(
      doc(db,"players",name)
    );

  }catch(error){

    console.error(error);

    alert(
      "Firebase error: " +
      error.message
    );

  }

}


/* =========================
   ADMIN LIST
========================= */

function renderAdmin(){

  let box=
    document.getElementById("adminPlayers");

  if(!box)return;

  box.innerHTML="";

  Object.keys(players).forEach(name=>{

    let row=
      document.createElement("div");

    row.className="admin-player";

    row.innerHTML=`

      <div>
        <strong>${name}</strong>
      </div>

      <div class="admin-actions">

        <button
          onclick="deletePlayer('${name.replace(/'/g,"\\'")}')"
        >
          DELETE
        </button>

      </div>

    `;

    box.appendChild(row);

  });

}


/* =========================
   MAKE FUNCTIONS AVAILABLE
   TO HTML ONCLICK
========================= */

window.showSection=showSection;
window.changeMode=changeMode;
window.loginAdmin=loginAdmin;
window.addPlayer=addPlayer;
window.deletePlayer=deletePlayer;
window.renderTierList=renderTierList;
window.renderOverall=renderOverall;
window.renderPlayers=renderPlayers;
window.renderAdmin=renderAdmin;

   </script>
